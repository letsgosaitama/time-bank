<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Bank Pro</title>
    <!-- Faviconのエラー(404)を防ぐ -->
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="tabs">
        <div id="timerTab" class="tab active">TIMER</div>
        <div id="graphTab" class="tab">GRAPH</div>
    </div>

    <!-- タイマーページ -->
    <div id="timerPage">
        <div id="timer">00:00:00</div>
        <div class="buttons">
            <button id="upBtn">UP</button>
            <button id="downBtn">DOWN</button>
            <button id="stopBtn">STOP</button>
            <button id="resetBtn">RESET</button>
        </div>
    </div>

    <!-- グラフページ -->
    <div id="graphPage" style="display:none;">
        <div class="subTabs">
            <button class="subTab active" onclick="showSubTab('min')">MIN</button>
            <button class="subTab" onclick="showSubTab('hour')">HOUR</button>
            <button class="subTab" onclick="showSubTab('day')">DAY</button>
            <button class="subTab" onclick="showSubTab('week')">WEEK</button>
        </div>

        <div class="graph-main-layout">
            <!-- 最新仕様の縦スライダー -->
            <div class="y-axis-container">
                <span class="y-label">MAX</span>
                <input type="range" id="yMaxSlider" min="60" max="86400" step="60">
                <span id="yMaxDisplay">AUTO</span>
            </div>

            <div class="charts-wrapper">
                <div id="subMin" class="subTabContent">
                    <div class="minControls">
                        <div class="sliderRow">
                            <label>日付</label><input type="range" id="dateSlider" value="0"><span id="dateLabel">-</span>
                        </div>
                        <div class="sliderRow">
                            <label>時間</label><input type="range" id="hourSlider" min="0" max="23" value="0"><span id="hourLabel">0時</span>
                        </div>
                    </div>
                    <div class="chartContainer"><canvas id="minChart"></canvas></div>
                </div>

                <div id="subHour" class="subTabContent" style="display:none;">
                    <div class="minControls">
                        <div class="sliderRow">
                            <label>日付</label><input type="range" id="hourDateSlider" value="0"><span id="hourDateLabel">-</span>
                        </div>
                    </div>
                    <div class="chartContainer"><canvas id="historyChart"></canvas></div>
                </div>

                <div id="subDay" class="subTabContent" style="display:none;">
                    <div class="minControls">
                        <div class="sliderRow">
                            <label>月別</label><input type="range" id="dayMonthSlider" value="0"><span id="dayMonthLabel">-</span>
                        </div>
                    </div>
                    <div class="chartContainer"><canvas id="dayChart"></canvas></div>
                </div>

                <div id="subWeek" class="subTabContent" style="display:none;">
                    <div class="minControls">
                        <div class="sliderRow">
                            <label>月別</label><input type="range" id="weekMonthSlider" value="0"><span id="weekMonthLabel">-</span>
                        </div>
                    </div>
                    <div class="chartContainer"><canvas id="weekChart"></canvas></div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
