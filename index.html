<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Bank Pro</title>
    <link rel="stylesheet" href="style.css">
    <!-- Chart.js & Plugins -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1"></script>
    <!-- Firebase (App, Database, Analytics) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="tabs">
        <div id="timerTab" class="tab active">TIMER</div>
        <div id="graphTab" class="tab">GRAPH</div>
    </div>

    <!-- タイマーページ -->
    <div id="timerPage">
        <div id="timer">00:00:00</div>
        <div class="buttons">
            <button id="upBtn">UP</button>
            <button id="downBtn">DOWN</button>
            <button id="stopBtn">STOP</button>
            <button id="resetBtn">RESET</button>
        </div>
    </div>

    <!-- グラフページ -->
    <div id="graphPage" style="display:none;">
        <div class="subTabs">
            <button class="subTab active" onclick="showSubTab('min')">MIN</button>
            <button class="subTab" onclick="showSubTab('hour')">HOUR</button>
            <button class="subTab" onclick="showSubTab('day')">DAY</button>
            <button class="subTab" onclick="showSubTab('week')">WEEK</button>
        </div>

        <!-- 縦軸調整エリア -->
        <div class="axis-controls">
            <label>縦軸最大値:</label>
            <input type="number" id="yMaxInput" placeholder="自動">
            <button id="applyYScaleBtn" onclick="updateAllChartsScale()">適用</button>
        </div>

        <!-- 各グラフ表示エリア -->
        <div id="subMin" class="subTabContent">
            <div class="minControls">
                <div class="sliderRow">
                    <label>日付</label>
                    <input type="range" id="dateSlider" value="0">
                    <span id="dateLabel">-</span>
                </div>
                <div class="sliderRow">
                    <label>時間</label>
                    <input type="range" id="hourSlider" min="0" max="23" value="0">
                    <span id="hourLabel">0時</span>
                </div>
            </div>
            <div class="chartContainer"><canvas id="minChart"></canvas></div>
        </div>

        <div id="subHour" class="subTabContent" style="display:none;">
            <div class="minControls">
                <div class="sliderRow">
                    <label>日付</label>
                    <input type="range" id="hourDateSlider" value="0">
                    <span id="hourDateLabel">-</span>
                </div>
            </div>
            <div class="chartContainer"><canvas id="historyChart"></canvas></div>
        </div>

        <div id="subDay" class="subTabContent" style="display:none;">
            <div class="minControls">
                <div class="sliderRow">
                    <label>月別</label>
                    <input type="range" id="dayMonthSlider" value="0">
                    <span id="dayMonthLabel">-</span>
                </div>
            </div>
            <div class="chartContainer"><canvas id="dayChart"></canvas></div>
        </div>

        <div id="subWeek" class="subTabContent" style="display:none;">
            <div class="minControls">
                <div class="sliderRow">
                    <label>月別</label>
                    <input type="range" id="weekMonthSlider" value="0">
                    <span id="weekMonthLabel">-</span>
                </div>
            </div>
            <div class="chartContainer"><canvas id="weekChart"></canvas></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
