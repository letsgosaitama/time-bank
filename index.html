<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Bank</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="tabs">
        <button id="timerTab" class="tab active">TIMER</button>
        <button id="graphTab" class="tab">GRAPH</button>
    </div>

    <!-- タイマーページ -->
    <div id="timerPage">
        <div id="timer">00:00:00</div>
        <div class="buttons">
            <button id="upBtn">COUNT UP</button>
            <button id="downBtn">COUNT DOWN</button>
            <button id="stopBtn">STOP</button>
            <button id="resetBtn">RESET</button>
        </div>
    </div>

    <!-- グラフページ -->
    <div id="graphPage" style="display:none;">
        <div class="subTabs">
            <button class="subTab active" onclick="showSubTab('min')">MIN</button>
            <button class="subTab" onclick="showSubTab('hour')">HOUR</button>
            <button class="subTab" onclick="showSubTab('day')">DAY</button>
            <button class="subTab" onclick="showSubTab('week')">WEEK</button>
        </div>

        <div id="subMin">
            <div class="minControls">
                <div class="sliderRow">
                    <label>日付</label>
                    <input type="range" id="dateSlider" min="0" max="0" value="0">
                    <span id="dateLabel">-</span>
                </div>
                <div class="sliderRow">
                    <label>時間</label>
                    <input type="range" id="hourSlider" min="0" max="23" value="0">
                    <span id="hourLabel">0時</span>
                </div>
            </div>
            <div class="chartContainer" style="height:300px; position:relative;">
                <canvas id="minChart"></canvas>
            </div>
        </div>

        <div id="subHour" style="display:none;">
            <div class="chartContainer" style="height:300px; position:relative;">
                <canvas id="historyChart"></canvas>
            </div>
        </div>
        
        <div id="subDay" style="display:none;"><div class="chartContainer" style="height:300px; position:relative;"><canvas id="dayChart"></canvas></div></div>
        <div id="subWeek" style="display:none;"><div class="chartContainer" style="height:300px; position:relative;"><canvas id="weekChart"></canvas></div></div>
    </div>

    <!-- 外部ライブラリ (ブロック対策としてumd版や別CDNを検討) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        // Firebase初期化 (Tracking Prevention対策)
        const firebaseConfig = {
            apiKey: "AIzaSyBOxVHqeHmdL3KVvUDFCGh6hGAd8LbEL2w",
            authDomain: "timebank-1c2f8.firebaseapp.com",
            databaseURL: "https://timebank-1c2f8-default-rtdb.firebaseio.com",
            projectId: "timebank-1c2f8",
            storageBucket: "timebank-1c2f8.firebasestorage.app",
            messagingSenderId: "879959904736",
            appId: "1:879959904736:web:bee79380194a6b3ba1db85"
        };
        
        try {
            firebase.initializeApp(firebaseConfig);
            // ストレージへのアクセスがブロックされても通信を優先する
            firebase.database().goOnline();
        } catch (e) {
            console.error("Firebase init error:", e);
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
