<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Bank</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="tabs">
        <button id="timerTab" class="tab active">TIMER</button>
        <button id="graphTab" class="tab">GRAPH</button>
    </div>

    <!-- タイマーページ -->
    <div id="timerPage">
        <div id="timer">00:00:00</div>
        <div class="buttons">
            <button id="upBtn">COUNT UP</button>
            <button id="downBtn">COUNT DOWN</button>
            <button id="stopBtn">STOP</button>
            <button id="resetBtn">RESET</button>
        </div>
    </div>

    <!-- グラフページ -->
    <div id="graphPage" style="display:none;">
        <div class="subTabs">
            <button class="subTab active" id="btnSubMin" onclick="showSubTab('min')">MIN</button>
            <button class="subTab" id="btnSubHour" onclick="showSubTab('hour')">HOUR</button>
            <button class="subTab" id="btnSubDay" onclick="showSubTab('day')">DAY</button>
            <button class="subTab" id="btnSubWeek" onclick="showSubTab('week')">WEEK</button>
        </div>

        <!-- MIN (分単位グラフ) -->
        <div id="subMin">
            <div class="minControls">
                <div class="sliderRow">
                    <label>日付</label>
                    <input type="range" id="dateSlider" min="0" max="0" value="0">
                    <span id="dateLabel">-</span>
                </div>
                <div class="sliderRow">
                    <label>時間</label>
                    <input type="range" id="hourSlider" min="0" max="23" value="0">
                    <span id="hourLabel">0時</span>
                </div>
            </div>
            <div class="chartContainer" style="position: relative; height:300px;">
                <canvas id="minChart"></canvas>
            </div>
        </div>

        <!-- HOUR (時間単位グラフ) -->
        <div id="subHour" style="display:none;">
            <div class="minControls">
                <div class="sliderRow">
                    <label>年月日</label>
                    <input type="range" id="hourDateSlider" min="0" max="0" value="0">
                    <span id="hourDateLabel">-</span>
                </div>
            </div>
            <div class="chartContainer" style="position: relative; height:300px;">
                <canvas id="historyChart"></canvas>
            </div>
        </div>

        <!-- DAY (日単位グラフ) -->
        <div id="subDay" style="display:none;">
            <div class="minControls">
                <div class="sliderRow">
                    <label>年月</label>
                    <input type="range" id="dayMonthSlider" min="0" max="0" value="0">
                    <span id="dayMonthLabel">-</span>
                </div>
            </div>
            <div class="chartContainer" style="position: relative; height:300px;">
                <canvas id="dayChart"></canvas>
            </div>
        </div>

        <!-- WEEK (週単位グラフ - 枠のみ) -->
        <div id="subWeek" style="display:none;">
            <div class="chartContainer" style="position: relative; height:300px;">
                <canvas id="weekChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom"></script>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script src="script.js"></script>
</body>
</html>
